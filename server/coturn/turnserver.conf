# coturn configuration for the game-2 P2P STUN/TURN relay.
#
# Only NON-secret settings live here (this file is committed). The shared auth secret
# is injected at runtime via the --static-auth-secret CLI flag in docker-compose.yml
# from the TURN_SECRET env var, so it never lands in git. See docs/turn.md.

# STUN/TURN listener. With host networking (see compose) this binds the host's :3478.
listening-port=3478

# The realm advertised to clients. Convention: your domain. Not security-sensitive.
realm=game.dev.snowskeleton.net

# Ephemeral, time-limited credentials (the "TURN REST API" scheme): the game server
# mints a username/password from the shared secret, and coturn verifies it with the
# same secret. No stored user accounts; a leaked client credential expires on its own.
use-auth-secret

# The UDP port window coturn hands out for relayed media. Keep it small, and OPEN THESE
# on the host firewall alongside 3478/udp and 3478/tcp.
min-port=49160
max-port=49200

# Abuse containment. This relay only ever forwards our WebRTC game traffic: 20 Hz JSON
# state snapshots host→guest (~60 KB/s on a busy floor) plus tiny guest→host inputs. The
# caps below sit at ~2× that so a real session never notices them, but the relay is
# useless for bulk data (video, a proxy/botnet) no matter how many ephemeral credentials
# someone mints from /api/ice. max-bps is the load-bearing one — it's enforced in the
# relay itself, independent of who holds a credential.
max-bps=125000        # ~1 Mbps per allocation — 2× a busy game session
user-quota=6          # max simultaneous allocations per credential (host + 3 guests + slack)
total-quota=20        # max simultaneous allocations server-wide
bps-capacity=3000000  # ~24 Mbps aggregate ceiling for the whole relay

# Log to stdout so `docker compose logs coturn` shows activity; drop the admin telnet
# CLI (an unused listening socket).
log-file=stdout
no-cli
fingerprint

# No TLS listeners: the page is served over HTTPS, but browsers accept plain turn:/stun:
# URLs for the relay itself, so no cert is needed here. (If a restrictive firewall later
# needs turns: on 443, add tls-listening-port + cert/pkey and open that port.)
no-tls
no-dtls

# If this host reaches the internet through NAT — i.e. its PUBLIC IP is not the address
# coturn binds to — uncomment and set the public IP, or relayed candidates will carry an
# address peers can't reach. Most single-VPS setups have the public IP on the interface
# and do NOT need this.
# external-ip=203.0.113.10
