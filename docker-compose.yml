# Two services, both started by a plain `docker compose up`:
#   server  — serves the built client + P2P signaling on :2567. Point your external
#             Caddy at <this-host>:2567. Single stateful process (in-memory, unshared
#             state) — do NOT scale to replicas.
#   coturn  — the STUN/TURN relay peers fall back to when direct P2P can't traverse
#             their NATs. Now part of the default stack, so the relay is always on.
#
# TURN_SECRET is just a shared key between the two services above (the server mints
# credentials, coturn verifies them) — it needn't be durable, since sessions die on
# restart anyway. So generate a fresh one at boot and let compose inject the same value
# into both services in a single interpolation pass:
#
#   TURN_SECRET=$(openssl rand -hex 32) docker compose up -d --build
#
# Nothing is stored: the secret lives only in the running containers' env, and a
# crash-restart of either keeps its baked-in value so they stay in sync. The only rule is
# to bring BOTH up together (a plain `up` always does) — never recreate just one.
#
# The durable, non-secret config lives in a .env beside this file (see .env.example):
# TURN_HOST, and optionally ALLOWED_ORIGINS. See docs/turn.md.
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=2567
      # Shared with coturn below so /api/ice can mint matching credentials. Empty →
      # the server advertises STUN only (no TURN), which is a clean no-op.
      - TURN_SECRET=${TURN_SECRET:-}
      # The public hostname clients dial for TURN (e.g. game.dev.snowskeleton.net). Also
      # drives the /api/ice origin gate: it defaults to allowing https://<TURN_HOST>.
      - TURN_HOST=${TURN_HOST:-}
      # OPTIONAL override for the origin gate. Leave empty to gate to https://<TURN_HOST>
      # (the common case). Set only for a page served from a different origin, or several
      # (comma-separated), e.g. ALLOWED_ORIGINS=https://game.example.net,https://staging.example.net
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    ports:
      - "2567:2567"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2567/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # Host networking: TURN advertises real addresses and hands out a wide UDP relay
    # range, both of which Docker's bridge NAT would mangle. This binds coturn straight
    # to the host — so OPEN 3478/udp, 3478/tcp and 49160-49200/udp on the firewall.
    network_mode: host
    volumes:
      - ./server/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    # The secret is read from the container's ENV at runtime (not interpolated into the
    # compose file). The `:?` guard makes coturn abort at startup with a clear message if
    # TURN_SECRET is unset, so a misconfigured deploy fails loud instead of running a relay
    # nobody can authenticate to. The `$$` escapes compose interpolation so the shell, not
    # compose, expands $TURN_SECRET.
    environment:
      - TURN_SECRET=${TURN_SECRET:-}
    entrypoint: ["sh", "-c"]
    command:
      - ': "$${TURN_SECRET:?set TURN_SECRET in .env to run coturn}"; exec turnserver -c /etc/coturn/turnserver.conf --static-auth-secret="$$TURN_SECRET"'
